version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - AWS_REGION=us-east-1
      - NODE_ENV=production
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-1234}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
