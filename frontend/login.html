<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudPulse | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="js/config.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body class="bg-[#1B1A19]">
  <div id="root"></div>
  <!-- Generated from src/LoginPage.jsx so the page runs without a build step. -->
  <script type="text/babel">
const { useEffect, useRef, useState } = React;

/* ---------- Icons (inline SVG, no emoji) ---------- */
const svg = (d, extra) => (props) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" {...props}>{d}{extra}</svg>
);
const MailIcon = svg(<><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></>);
const LockIcon = svg(<><rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></>);
const EyeIcon = svg(<><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></>);
const EyeOffIcon = svg(<><path d="M3 3l18 18" /><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.3-1" /><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" /></>);
const GitHubIcon = (p) => (
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" {...p}><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z" /></svg>
);
const GoogleIcon = (p) => (
  <svg viewBox="0 0 24 24" aria-hidden="true" {...p}>
    <path fill="#4285F4" d="M22.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.29h5.9a5.05 5.05 0 0 1-2.19 3.31v2.75h3.54c2.07-1.91 3.25-4.72 3.25-8.08Z" />
    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.54-2.75c-.98.66-2.24 1.05-3.74 1.05-2.87 0-5.3-1.94-6.17-4.55H2.17v2.84A11 11 0 0 0 12 23Z" />
    <path fill="#FBBC05" d="M5.83 14.09A6.6 6.6 0 0 1 5.48 12c0-.73.13-1.43.35-2.09V7.07H2.17a11 11 0 0 0 0 9.86l3.66-2.84Z" />
    <path fill="#EA4335" d="M12 5.36c1.62 0 3.07.56 4.21 1.65l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.17 7.07l3.66 2.84C6.7 7.3 9.13 5.36 12 5.36Z" />
  </svg>
);

/* ---------- Background: interconnected nodes with traveling signals ---------- */
function NetworkCanvas() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const LINK = 150;
    let w = 0, h = 0, raf = 0, nodes = [], signals = [];
    const mouse = { x: -999, y: -999 };

    const resize = () => {
      const d = window.devicePixelRatio || 1;
      w = c.clientWidth; h = c.clientHeight;
      c.width = w * d; c.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
      const n = Math.round(Math.min(60, Math.max(20, (w * h) / 26000)));
      nodes = Array.from({ length: n }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.28, vy: (Math.random() - 0.5) * 0.28,
        r: 1.5 + Math.random() * 1.6, hub: Math.random() < 0.12,
      }));
      signals = [];
    };
    const onMove = (e) => { const r = c.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; };
    const onLeave = () => { mouse.x = mouse.y = -999; };

    const frame = () => {
      ctx.clearRect(0, 0, w, h);
      for (const n of nodes) {
        if (!reduce) { n.x += n.vx; n.y += n.vy; }
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
        const dx = mouse.x - n.x, dy = mouse.y - n.y;
        if (dx * dx + dy * dy < 140 * 140) { n.x += dx * 0.004; n.y += dy * 0.004; }
      }
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < LINK) {
            ctx.strokeStyle = `rgba(69,178,157,${(1 - d / LINK) * 0.28})`; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        const m = Math.hypot(nodes[i].x - mouse.x, nodes[i].y - mouse.y);
        if (m < 170) {
          ctx.strokeStyle = `rgba(229,152,102,${(1 - m / 170) * 0.55})`;
          ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
        }
      }
      if (!reduce && signals.length < 14 && Math.random() < 0.06) {
        const a = nodes[Math.floor(Math.random() * nodes.length)];
        const near = nodes.filter((b) => b !== a && Math.hypot(a.x - b.x, a.y - b.y) < LINK);
        if (near.length) signals.push({ a, b: near[Math.floor(Math.random() * near.length)], t: 0, v: 0.012 + Math.random() * 0.012 });
      }
      signals = signals.filter((s) => (s.t += s.v) < 1);
      for (const s of signals) {
        const x = s.a.x + (s.b.x - s.a.x) * s.t, y = s.a.y + (s.b.y - s.a.y) * s.t;
        const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
        g.addColorStop(0, "rgba(229,152,102,.9)"); g.addColorStop(1, "rgba(229,152,102,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.283); ctx.fill();
      }
      for (const n of nodes) {
        ctx.fillStyle = n.hub ? "#45B29D" : "rgba(69,178,157,.65)";
        ctx.beginPath(); ctx.arc(n.x, n.y, n.hub ? n.r + 1.6 : n.r, 0, 6.283); ctx.fill();
        if (n.hub) { ctx.strokeStyle = "rgba(69,178,157,.35)"; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5, 0, 6.283); ctx.stroke(); }
      }
      raf = requestAnimationFrame(frame);
    };

    resize(); frame();
    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerleave", onLeave);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerleave", onLeave); };
  }, []);
  return <canvas ref={ref} className="absolute inset-0 h-full w-full" aria-hidden="true" />;
}

/* ---------- Small pieces ---------- */
function PulseDot({ size = "h-2.5 w-2.5" }) {
  return (
    <span className={`relative inline-flex ${size}`}>
      <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-[#45B29D] opacity-60" />
      <span className="relative inline-flex h-full w-full rounded-full bg-[#45B29D] shadow-[0_0_10px_2px_rgba(69,178,157,0.7)]" />
    </span>
  );
}

function Field({ id, label, icon: Icon, right, ...props }) {
  return (
    <div>
      <label htmlFor={id} className="mb-1.5 block text-sm font-medium text-[#C9CED6]">{label}</label>
      <div className="flex items-center gap-2 rounded-lg border border-[#363534] bg-[#181716] px-3 transition focus-within:border-[#45B29D] focus-within:ring-2 focus-within:ring-[#45B29D]/30">
        <Icon className="h-4 w-4 shrink-0 text-[#8B929C]" />
        <input id={id} className="h-11 w-full min-w-0 bg-transparent text-sm text-white placeholder:text-[#7D8490] focus:outline-none" {...props} />
        {right}
      </div>
    </div>
  );
}

/* ---------- Page ---------- */
function LoginPage({ onSignIn }) {
  const [email, setEmail] = useState(() => { try { return localStorage.getItem("cp-email") || ""; } catch (_) { return ""; } });
  const [password, setPassword] = useState("");
  const [show, setShow] = useState(false);
  const [remember, setRemember] = useState(() => { try { return !!localStorage.getItem("cp-email"); } catch (_) { return false; } });
  const [loading, setLoading] = useState(false);
  const [message, setMessage] = useState({ kind: "", text: "" });
  const [latency, setLatency] = useState(12);

  useEffect(() => {
    const t = setInterval(() => setLatency(9 + Math.floor(Math.random() * 8)), 2500);
    return () => clearInterval(t);
  }, []);

  const submit = (e) => {
    e.preventDefault();
    if (!email.trim() || !password) return setMessage({ kind: "error", text: "Enter your email or username and your password." });
    setMessage({ kind: "", text: "" }); setLoading(true);
    try { remember ? localStorage.setItem("cp-email", email.trim()) : localStorage.removeItem("cp-email"); } catch (_) {}
    const API = window.CLOUDPULSE_API || "http://localhost:5001";
    fetch(`${API}/api/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ identifier: email.trim(), password }) })
      .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Sign in failed."); return d; })
      .then((d) => {
        try { (remember ? localStorage : sessionStorage).setItem("cp-token", d.token); (remember ? sessionStorage : localStorage).removeItem("cp-token"); } catch (_) {}
        if (onSignIn) onSignIn(d); else window.location.href = "index.html";
      })
      .catch((err) => setMessage({ kind: "error", text: /failed to fetch|load failed|networkerror/i.test(err.message) ? `Cannot reach the backend at ${API}. Start it with npm start in the backend folder.` : err.message }))
      .finally(() => setLoading(false));
  };
  const notice = (text) => setMessage({ kind: "info", text });

  return (
    <div className="relative min-h-screen overflow-hidden bg-[#1B1A19] font-['Inter',system-ui,sans-serif] text-[#C9CED6]">
      <NetworkCanvas />
      <div className="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_30%,#1B1A19_95%)]" />

      <div className="relative z-10 flex min-h-screen flex-col">
        <header className="flex items-center gap-2.5 px-6 py-5 sm:px-10">
          <PulseDot />
          <span className="text-lg font-semibold tracking-tight text-white">CloudPulse</span>
        </header>

        <main className="flex flex-1 items-center px-4 pb-8 sm:px-10">
          <div className="mx-auto grid w-full max-w-6xl items-center gap-12 lg:grid-cols-2">
            <section className="hidden lg:block" aria-label="Product summary">
              <h2 className="max-w-md text-4xl font-semibold leading-tight tracking-tight text-white [text-wrap:balance]">Traffic, balanced in real time.</h2>
              <p className="mt-4 max-w-md text-base leading-relaxed text-[#9CA3AE] [text-wrap:pretty]">
                Watch every request move across your servers. Greedy and min-heap scheduling keep load even, and you can drain or restore a server in one click.
              </p>
            </section>

            <div className="mx-auto w-full max-w-md lg:mr-0">
              <div className="rounded-xl border border-[#363534] bg-[#242322]/80 p-6 shadow-xl shadow-black/30 backdrop-blur-xl sm:p-8">
                <h1 className="text-2xl font-semibold tracking-tight text-white [text-wrap:balance]">Welcome back to CloudPulse</h1>
                <p className="mt-1.5 text-sm text-[#9CA3AE] [text-wrap:pretty]">Log in to manage your cluster &amp; traffic load balancing.</p>

                <form onSubmit={submit} className="mt-6 space-y-4" noValidate>
                  <Field id="email" label="Email or username" icon={MailIcon} type="text" autoComplete="username" placeholder="you@company.com" value={email} onChange={(e) => setEmail(e.target.value)} />
                  <Field id="password" label="Password" icon={LockIcon} type={show ? "text" : "password"} autoComplete="current-password" placeholder="Enter your password" value={password} onChange={(e) => setPassword(e.target.value)}
                    right={
                      <button type="button" onClick={() => setShow(!show)} aria-label={show ? "Hide password" : "Show password"} aria-pressed={show}
                        className="rounded p-1 text-[#8B929C] transition hover:text-white focus-visible:outline-2 focus-visible:outline-[#E59866]">
                        {show ? <EyeOffIcon className="h-4 w-4" /> : <EyeIcon className="h-4 w-4" />}
                      </button>
                    } />

                  <div className="flex items-center justify-between gap-3 text-sm">
                    <label className="flex cursor-pointer items-center gap-2 text-[#C9CED6]">
                      <input type="checkbox" checked={remember} onChange={(e) => setRemember(e.target.checked)} className="h-4 w-4 rounded border-[#363534] bg-[#181716] accent-[#45B29D] focus-visible:outline-2 focus-visible:outline-[#E59866]" />
                      <span className="whitespace-nowrap">Remember me</span>
                    </label>
                    <a href="#" onClick={(e) => { e.preventDefault(); notice("Password reset needs a connected auth service."); }} className="whitespace-nowrap text-[#45B29D] transition hover:text-[#6FCDBA] hover:underline">Forgot Password?</a>
                  </div>

                  <p role="status" aria-live="polite" className={`min-h-[1.25rem] text-sm ${message.kind === "error" ? "text-[#E59866]" : "text-[#9CA3AE]"}`}>{message.text}</p>

                  <button type="submit" disabled={loading}
                    className="group flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-[#45B29D] text-sm font-semibold text-white transition duration-200 hover:bg-[#368F7E] hover:shadow-lg hover:shadow-[#45B29D]/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#E59866] active:scale-[0.99] disabled:cursor-wait disabled:opacity-80">
                    {loading ? (<><span className="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white" />Signing in</>) : (
                      <>Sign In to Dashboard<svg viewBox="0 0 24 24" className="h-4 w-4 transition-transform duration-200 group-hover:translate-x-0.5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></>
                    )}
                  </button>
                </form>

                <div className="my-6 flex items-center gap-3 text-xs text-[#7D8490]" role="separator">
                  <span className="h-px flex-1 bg-[#363534]" /><span>Or continue with</span><span className="h-px flex-1 bg-[#363534]" />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {[["GitHub", GitHubIcon], ["Google", GoogleIcon]].map(([name, Icon]) => (
                    <button key={name} type="button" onClick={() => notice(`${name} sign-in needs an OAuth app configured.`)}
                      className="flex h-11 items-center justify-center gap-2 rounded-lg border border-[#363534] bg-[#1F1E1D] text-sm font-medium text-white transition hover:border-[#4A4846] hover:bg-[#2B2A28] focus-visible:outline-2 focus-visible:outline-[#E59866]">
                      <Icon className="h-4 w-4" />{name}
                    </button>
                  ))}
                </div>

                <div className="mt-6 flex items-center justify-center gap-2 border-t border-[#363534] pt-5 text-xs text-[#9CA3AE]" role="status">
                  <PulseDot size="h-2 w-2" />
                  <span className="whitespace-nowrap">All Systems Operational</span>
                  <span className="text-[#4A4846]">|</span>
                  <span className="whitespace-nowrap">Latency: <span className="font-mono tabular-nums text-white">{latency}ms</span></span>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LoginPage />);
  </script>
</body>
</html>
